<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #121417; --panel-2: #171a1e; --line: #24282e;
    --text: #e7e9ec; --muted: #8b929c; --faint: #5c636d;
    --accent: #4f8cff; --ok: #2fbf71; --warn: #e3a008; --bad: #f05252; --busy: #a78bfa;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .dot { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  header .dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: block; }
  header .dot.live i { background: var(--ok); box-shadow: 0 0 0 3px rgba(47,191,113,.15); }

  main { display: grid; grid-template-columns: 280px minmax(0,1fr) 340px; gap: 1px; background: var(--line); height: calc(100vh - 53px); }
  section { background: var(--bg); overflow-y: auto; padding: 16px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } section { height: auto; } }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 0 0 12px; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; }
  .bot { display: flex; gap: 10px; align-items: flex-start; }
  .bot .emoji { font-size: 22px; line-height: 1.1; }
  .bot .name { font-weight: 600; }
  .bot .role { color: var(--muted); font-size: 12px; }
  .bot .stats { color: var(--faint); font-size: 11px; margin-top: 6px; font-variant-numeric: tabular-nums; }

  .job { display: flex; gap: 10px; align-items: flex-start; }
  .job .title { font-weight: 500; }
  .job .meta { color: var(--faint); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .job .summary { color: var(--muted); font-size: 12px; margin-top: 7px; border-left: 2px solid var(--line); padding-left: 9px; }

  .pill { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 3px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.running, .pill.dispatched { color: var(--busy); border-color: color-mix(in oklab, var(--busy) 40%, var(--line)); }
  .pill.done { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 40%, var(--line)); }
  .pill.failed { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 40%, var(--line)); }
  .pill.blocked { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 40%, var(--line)); }
  .pill.active { color: var(--ok); }
  .pill.paused { color: var(--warn); }

  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .feed time { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11px; padding-top: 1px; }
  .feed .k { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }

  #transcript { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .msg { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--panel); white-space: pre-wrap; }
  .msg.you { background: var(--panel-2); border-color: #2b3542; }
  .msg .who { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 5px; }
  .msg.tool { color: var(--muted); font-size: 12px; padding: 6px 12px; background: transparent; border-style: dashed; }

  .ask { border: 1px solid color-mix(in oklab, var(--warn) 45%, var(--line)); background: color-mix(in oklab, var(--warn) 7%, var(--panel)); border-radius: var(--radius); padding: 12px; }
  .ask .prompt { white-space: pre-wrap; font-size: 13px; max-height: 260px; overflow-y: auto; }
  .ask .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer; }
  button:hover { border-color: #384150; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--bg); padding-top: 10px; }
  input[type=text] { flex: 1; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  .empty { color: var(--faint); font-size: 12.5px; padding: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>Bot</h1>
  <span class="sub" id="workspace">—</span>
  <span class="dot" id="status"><i></i><span>idle</span></span>
</header>

<main>
  <section>
    <h2>The team</h2>
    <div id="roster"><p class="empty">No bots yet. Ask HQ to hire one.</p></div>
  </section>

  <section>
    <h2>Desk</h2>
    <div id="transcript"></div>
    <div id="ask"></div>
    <form id="composer" autocomplete="off">
      <input type="text" id="input" placeholder="Ask HQ to hire someone, or hand off a job…" />
      <button class="primary" id="send">Send</button>
    </form>
  </section>

  <section>
    <h2>Work</h2>
    <div id="jobs"><p class="empty">Nothing assigned.</p></div>
    <h2 style="margin-top:22px">Activity</h2>
    <ul class="feed" id="feed"></ul>
  </section>
</main>

<script type="module">
const ROOM = new URLSearchParams(location.search).get("room") ?? "desk";
const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

function setStatus(text, live) {
  el("status").className = live ? "dot live" : "dot";
  el("status").lastElementChild.textContent = text;
}

/* ---- the board: roster, jobs, feed ---------------------------------- */

async function refresh() {
  let state;
  try {
    state = await (await fetch("/bot/v1/state")).json();
  } catch {
    return;
  }
  el("workspace").textContent = `workspace: ${state.workspaceId}`;

  el("roster").innerHTML = state.bots.length === 0
    ? '<p class="empty">No bots yet. Ask HQ to hire one.</p>'
    : state.bots.map((b) => `
      <div class="card bot">
        <div class="emoji">${esc(b.emoji)}</div>
        <div style="min-width:0">
          <div class="name">${esc(b.name)} <span class="pill ${esc(b.status)}">${esc(b.status)}</span></div>
          <div class="role">${esc(b.role)}</div>
          <div class="stats">${b.stats.jobsCompleted} done · ${b.stats.jobsFailed} failed</div>
        </div>
      </div>`).join("");

  const byId = Object.fromEntries(state.bots.map((b) => [b.id, b]));
  el("jobs").innerHTML = state.jobs.length === 0
    ? '<p class="empty">Nothing assigned.</p>'
    : state.jobs.map((j) => `
      <div class="card job">
        <div style="min-width:0;flex:1">
          <div class="title">${esc(j.title)}</div>
          <div class="meta">${esc(byId[j.botId]?.name ?? j.botId)} · ${esc(j.id)}${j.everyMinutes ? ` · every ${j.everyMinutes}m` : ""}</div>
          ${j.summary ? `<div class="summary">${esc(j.summary)}</div>` : ""}
        </div>
        <span class="pill ${esc(j.status)}">${esc(j.status)}</span>
      </div>`).join("");

  el("feed").innerHTML = state.activity.map((e) => `
    <li>
      <time>${clock(e.at)}</time>
      <div><div class="k">${esc(e.kind)}</div>${esc(e.text)}</div>
    </li>`).join("");
}

/* ---- the conversation ----------------------------------------------- */

function say(who, text, cls = "") {
  const node = document.createElement("div");
  node.className = `msg ${cls}`;
  node.innerHTML = `<div class="who">${esc(who)}</div>${esc(text)}`;
  el("transcript").append(node);
  node.scrollIntoView({ block: "nearest" });
  return node;
}

function note(text) {
  const node = document.createElement("div");
  node.className = "msg tool";
  node.textContent = text;
  el("transcript").append(node);
  node.scrollIntoView({ block: "nearest" });
}

/** Renders a pending approval or question, and answers it by requestId. */
function renderAsk(requests) {
  el("ask").innerHTML = "";
  for (const request of requests) {
    const card = document.createElement("div");
    card.className = "ask";
    const options = request.options ?? [{ id: "approve", label: "Approve" }];
    card.innerHTML = `
      <div class="prompt">${esc(request.prompt)}</div>
      <div class="row">${options.map((o) =>
        `<button data-id="${esc(o.id)}" class="${o.style === "primary" ? "primary" : ""}">${esc(o.label)}</button>`,
      ).join("")}</div>`;

    card.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", async () => {
        card.querySelectorAll("button").forEach((b) => (b.disabled = true));
        await fetch(`/bot/v1/rooms/${encodeURIComponent(ROOM)}/respond`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ responses: [{ requestId: request.requestId, optionId: button.dataset.id }] }),
        });
        note(`You answered: ${button.textContent}`);
        card.remove();
        refresh();
      });
    });
    el("ask").append(card);
  }
}

/**
 * Follows one session's NDJSON stream. Assistant messages land in the
 * transcript, tool calls become quiet notes, and anything the agent asks for
 * becomes a card you can answer.
 */
async function follow(sessionId) {
  const response = await fetch(`/bot/v1/sessions/${encodeURIComponent(sessionId)}/stream`);
  if (!response.body) return;
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += value;
    const lines = buffer.split("\n");
    buffer = lines.pop() ?? "";

    for (const line of lines) {
      if (line.trim() === "") continue;
      let event;
      try { event = JSON.parse(line); } catch { continue; }
      const data = event.data ?? {};

      switch (event.type) {
        case "turn.started": setStatus("working", true); break;
        case "actions.requested":
          for (const action of data.actions ?? []) note(`↳ ${action.toolName}`);
          break;
        case "subagent.called": note(`↳ handed to ${data.name}`); break;
        case "message.completed": if (data.message) say("HQ", data.message); break;
        case "input.requested": renderAsk(data.requests ?? []); setStatus("waiting on you", true); break;
        case "turn.failed": say("error", `${data.code}: ${data.message}`); break;
        case "session.waiting": setStatus("idle", false); refresh(); break;
        case "turn.completed": refresh(); break;
      }
    }
  }
}

/* ---- wiring ---------------------------------------------------------- */

const followed = new Set();

el("composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = el("input").value.trim();
  if (text === "") return;
  el("input").value = "";
  say("you", text, "you");
  setStatus("sending", true);

  const response = await fetch(`/bot/v1/rooms/${encodeURIComponent(ROOM)}/messages`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ message: text }),
  });
  const { sessionId } = await response.json();

  // One reader per session: later messages resume the same durable session.
  if (sessionId && !followed.has(sessionId)) {
    followed.add(sessionId);
    follow(sessionId).catch(() => setStatus("stream ended", false));
  }
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
