# Tests, types, and a full build on every pull request and every branch push.
#
# The build is the same `npm run build` a standalone server runs: `eve build`
# for the agent, then `next build` for the console. It needs no secrets: model
# keys and storage are read when the app runs. Since eve 0.79, `eve build` also
# prepares the computer's sandbox snapshot, which needs Vercel credentials, so
# CI skips that step: it checks the code builds, it does not ship it. main is
# left to Vercel, which builds every push itself.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    # Only in the original: a Deploy-button copy is private, so every run would spend its owner's Actions minutes,
    # and Vercel already builds each of its pushes.
    if: github.repository == 'Shaivpidadi/eve-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          BOT_SKIP_SANDBOX_PREWARM: "1"
